[project]
name = "commerceiq-portfolio"
version = "0.1.0"
description = "Real-data commerce analytics and independently evaluated marketing uplift"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.1,<2", "pandas>=2.2,<4", "numpy>=1.26,<3", "scipy>=1.12,<2", "scikit-learn>=1.4,<1.10", "scikit-uplift==0.5.1", "streamlit>=1.40,<2", "plotly>=5.24,<8", "requests>=2.32,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
